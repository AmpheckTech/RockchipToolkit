name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ampheck.RockchipToolkit.slnx -r ${{ matrix.rid }}

      - name: Check formatting
        if: matrix.rid == 'linux-x64'
        run: dotnet format Ampheck.RockchipToolkit.slnx --verify-no-changes --no-restore

      - name: Build
        run: >
          dotnet build Ampheck.RockchipToolkit.csproj
          -c Release -r ${{ matrix.rid }} --no-restore

      - name: Check vulnerable dependencies
        if: matrix.rid == 'linux-x64'
        run: dotnet list Ampheck.RockchipToolkit.slnx package --vulnerable --include-transitive
